name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build, test and verify release
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Build.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: myka-win-x64
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .artifacts/publish/
            .artifacts/*.zip
            .artifacts/*.sha256

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified Windows package
        uses: actions/download-artifact@v4
        with:
          name: myka-win-x64
          path: .artifacts/release

      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/PublishRelease.ps1
